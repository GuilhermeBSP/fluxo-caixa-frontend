<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contas — Fluxo de Caixa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>

<div class="bg-mesh" aria-hidden="true">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<header class="app-header">
  <a href="/index.html" class="header-brand">
    <div class="brand-icon"><i class="bi bi-cash-stack"></i></div>
    <span>Fluxo de Caixa</span>
  </a>
  <div class="header-right">
    <span id="headerDate" class="header-date"></span>
    <button class="ai-btn" onclick="toggleChat()" title="Assistente IA">
      <i class="bi bi-robot"></i><span>IA</span>
    </button>
  </div>
</header>

<nav class="nav-strip">
  <a href="/index.html" class="nav-card"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
  <a href="/transactions.html" class="nav-card"><i class="bi bi-arrow-left-right"></i><span>Transações</span></a>
  <a href="/recurring.html" class="nav-card"><i class="bi bi-arrow-repeat"></i><span>Recorrentes</span></a>
  <a href="/accounts.html" class="nav-card"><i class="bi bi-bank2"></i><span>Contas</span></a>
  <a href="/categories.html" class="nav-card"><i class="bi bi-tags"></i><span>Categorias</span></a>
  <a href="/reports.html" class="nav-card"><i class="bi bi-bar-chart-line"></i><span>Relatórios</span></a>
</nav>

<main class="page-content">

<div class="section-header mb-4">
  <div>
    <h5 class="mb-0 fw-bold" style="letter-spacing:-.02em">Contas</h5>
    <div class="text-muted" style="font-size:.78rem;margin-top:2px">Gerencie suas contas bancárias e carteiras</div>
  </div>
  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalAccount">
    <i class="bi bi-plus-lg me-1"></i>Nova Conta
  </button>
</div>

<div class="row g-3" id="accountsList"></div>

<div class="modal fade" id="modalAccount" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Nova Conta</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formAccount">
          <div class="mb-3">
            <label class="form-label">Nome *</label>
            <input type="text" name="name" class="form-control" required maxlength="100" placeholder="Ex: Nubank, Bradesco...">
          </div>
          <div class="mb-3">
            <label class="form-label">Tipo *</label>
            <select name="type" class="form-select" required>
              <option value="checking">Conta Corrente</option>
              <option value="savings">Poupança</option>
              <option value="cash">Dinheiro / Carteira</option>
              <option value="credit_card">Cartão de Crédito</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Saldo Inicial (R$)</label>
            <input type="number" name="balance" class="form-control" step="0.01" value="0">
          </div>
          <div class="mb-3">
            <label class="form-label">Descrição</label>
            <input type="text" name="description" class="form-control" maxlength="255" placeholder="Opcional">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="saveAccount()">Salvar</button>
      </div>
    </div>
  </div>
</div>

</main>

<div class="chat-panel" id="chatPanel">
  <div class="chat-header">
    <div class="ai-avatar"><i class="bi bi-robot"></i></div>
    <div class="chat-header-info">
      <strong>Assistente Financeiro</strong>
      <small><span class="online-dot"></span>Groq AI · Dados em tempo real</small>
    </div>
    <button onclick="toggleChat()" style="background:none;border:none;color:var(--text-muted);font-size:.9rem;cursor:pointer;padding:.25rem .4rem;line-height:1;border-radius:6px;transition:color .15s" onmouseenter="this.style.color='var(--text)'" onmouseleave="this.style.color='var(--text-muted)'">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>
  <div class="chat-messages" id="chatMessages">
    <div class="msg bot">
      <div class="msg-bubble">Olá! Sou seu assistente financeiro com acesso aos seus dados reais. Como posso ajudar? 💡</div>
    </div>
  </div>
  <div class="chat-input-row">
    <textarea class="chat-input" id="chatInput" rows="1" placeholder="Pergunte sobre suas finanças..." onkeydown="handleChatKey(event)"></textarea>
    <button class="chat-send" id="chatSend" onclick="sendChatMessage()"><i class="bi bi-send-fill"></i></button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/config.js"></script>
<script src="/app.js"></script>
<script>
const fmt = v => "R$ " + v.toLocaleString("pt-BR", {minimumFractionDigits:2});

const TYPE_LABELS = {checking:"Conta Corrente", savings:"Poupança", cash:"Dinheiro / Carteira", credit_card:"Cartão de Crédito"};
const TYPE_ICONS  = {checking:"bi-bank2", savings:"bi-piggy-bank", cash:"bi-cash-coin", credit_card:"bi-credit-card-2-front"};
const TYPE_COLORS = {
  checking:    ["rgba(59,130,246,.15)", "#60a5fa"],
  savings:     ["rgba(16,185,129,.15)", "#34d399"],
  cash:        ["rgba(251,191,36,.15)", "#fbbf24"],
  credit_card: ["rgba(244,63,94,.15)",  "#fb7185"],
};

async function loadAccounts() {
  const accounts = await fetch(api("/api/accounts/")).then(r=>r.json());
  const el = document.getElementById("accountsList");
  if(!accounts.length) {
    el.innerHTML = `<div class="col-12"><p class="text-muted" style="font-size:.875rem">Nenhuma conta cadastrada.</p></div>`;
    return;
  }
  el.innerHTML = accounts.map(a => {
    const [bg, fg] = TYPE_COLORS[a.type] || ["rgba(124,58,237,.15)", "#a78bfa"];
    return `
    <div class="col-md-4 col-sm-6">
      <div class="account-card">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <div class="d-flex align-items-center gap-3">
            <div class="account-icon" style="background:${bg};color:${fg}">
              <i class="bi ${TYPE_ICONS[a.type] || 'bi-wallet2'}"></i>
            </div>
            <div>
              <div class="fw-semibold" style="font-size:.9rem;letter-spacing:-.01em">${a.name}</div>
              <div class="text-muted" style="font-size:.74rem">${TYPE_LABELS[a.type] || a.type}</div>
            </div>
          </div>
          <button class="btn btn-sm btn-outline-danger p-1" style="width:28px;height:28px;line-height:1" onclick="deleteAccount(${a.id})">
            <i class="bi bi-trash" style="font-size:.75rem"></i>
          </button>
        </div>
        ${a.description ? `<div class="text-muted mb-3" style="font-size:.78rem">${a.description}</div>` : ""}
        <div style="border-top:1px solid var(--border);padding-top:.85rem;margin-top:auto">
          <div class="stat-label mb-1">Saldo Atual</div>
          <div class="fw-bold ${a.balance>=0?'amount-income':'amount-expense'}" style="font-size:1.4rem;letter-spacing:-.02em">${fmt(a.balance)}</div>
        </div>
      </div>
    </div>`;
  }).join("");
}

async function saveAccount() {
  const form = document.getElementById("formAccount");
  const data = Object.fromEntries(new FormData(form));
  data.balance = parseFloat(data.balance) || 0;
  const res = await fetch(api("/api/accounts/"), {
    method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(data)
  });
  if(res.ok) {
    bootstrap.Modal.getInstance(document.getElementById("modalAccount")).hide();
    form.reset();
    loadAccounts();
  } else {
    const err = await res.json();
    alert("Erro: " + JSON.stringify(err.detail));
  }
}

async function deleteAccount(id) {
  if(!confirm("Excluir esta conta e todas as suas transações?")) return;
  await fetch(api(`/api/accounts/${id}`), {method:"DELETE"});
  loadAccounts();
}

loadAccounts();
</script>
</body>
</html>
